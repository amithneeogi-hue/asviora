plugins {
    id 'com.android.application'
}

android {
    namespace 'com.asviora.games'
    compileSdk 34

    defaultConfig {
        applicationId "com.asviora.games"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Where the app talks to. Change this one line to point a build at
        // your own server — nothing else in the code hardcodes a host.
        buildConfigField "String", "API_BASE",
                "\"https://asviora.in/api/v1/\""
        buildConfigField "String", "SITE_BASE",
                "\"https://asviora.in/\""
    }

    buildTypes {
        debug {
            // XAMPP on the machine running the emulator: 10.0.2.2 is the
            // host's localhost as seen from inside the emulator.
            buildConfigField "String", "API_BASE",
                    "\"http://10.0.2.2/gamesv/api/v1/\""
            buildConfigField "String", "SITE_BASE",
                    "\"http://10.0.2.2/gamesv/\""
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'com.google.android.material:material:1.12.0'
}
